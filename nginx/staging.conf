upstream raven_staging {
    server raven:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Static files served directly by nginx
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded media (profile pictures, etc.) served directly by nginx
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket — upgrade and proxy to Daphne
    location /ws/ {
        proxy_pass http://raven_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;  # keep WS connections open
        proxy_send_timeout 86400s;
    }

    # Report generation — longer timeout for AI + PDF rendering
    location /api/reports/generate/management/ {
        proxy_pass http://raven_staging;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # API + everything else — proxy to Daphne
    location / {
        proxy_pass http://raven_staging;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
