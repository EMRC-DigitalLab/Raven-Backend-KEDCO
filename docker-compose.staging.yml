version: "3.9"

# ── Staging environment ───────────────────────────────────────────────────────
#   nginx          → host:8094  (system nginx proxies here for staging subdomain)
#   raven          → internal only (port 8000 inside the network)
#   celery-worker  → handles notifications + analytics queues
#   celery-sync    → handles datanest_sync queue (DataNest → Raven data pull)
#   celery-beat    → fires all scheduled tasks (every 15 min sync, daily checks)
#   Keycloak: uses shared instance at http://31.97.56.29:8083/realms/KEDCO
# ─────────────────────────────────────────────────────────────────────────────

networks:
  staging_net:
    driver: bridge

volumes:
  static_staging:
  redis_staging:

services:

  redis:
    image: redis:7-alpine
    container_name: redis_staging
    volumes:
      - redis_staging:/data
    networks:
      - staging_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  raven:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:staging
    container_name: raven_staging
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
    volumes:
      - static_staging:/app/staticfiles
    networks:
      - staging_net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8000/admin/ -o /dev/null -w '%{http_code}' | grep -qE '^(200|301|302)$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Celery: general worker (notifications + analytics) ─────────────────────
  celery-worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:staging
    container_name: celery_worker_staging
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
    entrypoint: ["celery", "-A", "raven", "worker",
                 "-Q", "default,notifications,analytics",
                 "--concurrency=2", "-l", "info"]
    networks:
      - staging_net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      raven:
        condition: service_healthy

  # ── Celery: DataNest sync worker (datanest_sync queue) ────────────────────
  celery-sync:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:staging
    container_name: celery_sync_staging
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
    entrypoint: ["celery", "-A", "raven", "worker",
                 "-Q", "datanest_sync",
                 "--concurrency=2", "-l", "info"]
    networks:
      - staging_net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      raven:
        condition: service_healthy

  # celery-beat intentionally omitted from staging — only prod fires scheduled
  # tasks; running beat in both environments caused duplicate syncs against the
  # shared production database, leading to stale last_synced_at values.

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_staging
    ports:
      - "8094:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - static_staging:/static:ro
    depends_on:
      - raven
    networks:
      - staging_net
    restart: unless-stopped
