version: "3.9"

# ── Staging environment ───────────────────────────────────────────────────────
#   nginx    → host:8094  (system nginx proxies here for staging subdomain)
#   keycloak → host:8095  (admin / SSO — http://VPS_IP:8095)
#   raven    → internal only (port 8000 inside the network)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  staging_net:
    driver: bridge

volumes:
  static_staging:
  keycloak_staging_data:

services:

  raven:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:staging
    container_name: raven_staging
    env_file: .env
    volumes:
      - static_staging:/app/staticfiles
    networks:
      - staging_net
    depends_on:
      - keycloak
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/api/auth/token/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_staging
    ports:
      - "8094:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - static_staging:/static:ro
    depends_on:
      - raven
    networks:
      - staging_net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak_staging
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8095:8080"
    volumes:
      - keycloak_staging_data:/opt/keycloak/data
    networks:
      - staging_net
    restart: unless-stopped
