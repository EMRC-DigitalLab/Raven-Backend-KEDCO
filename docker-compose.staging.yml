version: "3.9"

# ── Staging environment ───────────────────────────────────────────────────────
#   nginx → host:8094  (system nginx proxies here for staging subdomain)
#   raven → internal only (port 8000 inside the network)
#   Keycloak: uses shared instance at http://31.97.56.29:8083/realms/KEDCO
# ─────────────────────────────────────────────────────────────────────────────

networks:
  staging_net:
    driver: bridge

volumes:
  static_staging:

services:

  raven:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:staging
    container_name: raven_staging
    env_file: .env
    volumes:
      - static_staging:/app/staticfiles
    networks:
      - staging_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/api/auth/token/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_staging
    ports:
      - "8094:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - static_staging:/static:ro
    depends_on:
      - raven
    networks:
      - staging_net
    restart: unless-stopped
