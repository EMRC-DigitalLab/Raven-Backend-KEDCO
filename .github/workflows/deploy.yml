name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/raven

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint (black + ruff + isort) ───────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: isort — check import order
        run: isort --check-only .

      - name: black — check formatting
        run: black --check .

      - name: ruff — lint
        run: ruff check .


  # ── 2. Run tests ─────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: raven_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dataNestDB_KEDCO
          MYSQL_ROOT_PASSWORD: mysql_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: staging
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      STAGING_DB_NAME: raven_test
      STAGING_DB_USER: postgres
      STAGING_DB_PASSWORD: postgres_test
      STAGING_DB_HOST: localhost
      STAGING_DB_PORT: "5432"
      PRODUCTION_DB_NAME: raven_test
      PRODUCTION_DB_USER: postgres
      PRODUCTION_DB_PASSWORD: postgres_test
      PRODUCTION_DB_HOST: localhost
      PRODUCTION_DB_PORT: "5432"
      EX_DB_NAME: dataNestDB_KEDCO
      EX_DB_USER: root
      EX_DB_PASSWORD: mysql_test
      EX_DB_HOST: localhost
      EX_DB_PORT: "3306"
      BASE_URL: "http://localhost:8000"
      VISUALIZATION_API_URL: "http://localhost:8000"
      KEYCLOAK_REALM_URL: "http://localhost:8091/realms/KEDCO"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest


  # ── 3. Build & push Docker image ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── 4. Deploy → Staging ───────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/development'
    environment:
      name: staging

    steps:
      - name: Deploy + health-check + auto-rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /srv/raven/staging

            git fetch origin development
            git checkout development
            git pull origin development

            chmod +x scripts/deploy-staging.sh

            GITHUB_ACTOR="${{ github.actor }}" \
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            GITHUB_REPOSITORY="${{ github.repository }}" \
              bash scripts/deploy-staging.sh


  # ── 5. Deploy → Production (with rollback) ────────────────────────────────
  deploy-prod:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production             # ← requires manual approval in GitHub settings

    steps:
      - name: Deploy + health-check + auto-rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /srv/raven/prod

            git fetch origin main
            git checkout main
            git pull origin main

            chmod +x scripts/deploy-prod.sh

            GITHUB_ACTOR="${{ github.actor }}" \
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            GITHUB_REPOSITORY="${{ github.repository }}" \
            KC_ADMIN_PASSWORD="${{ secrets.KC_ADMIN_PASSWORD_PROD }}" \
            KC_HOSTNAME="${{ secrets.KC_HOSTNAME_PROD }}" \
            KC_DB_USER="${{ secrets.KC_DB_USER_PROD }}" \
            KC_DB_PASSWORD="${{ secrets.KC_DB_PASSWORD_PROD }}" \
              bash scripts/deploy-prod.sh
