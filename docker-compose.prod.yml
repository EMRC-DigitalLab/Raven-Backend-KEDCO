version: "3.9"

# ── Production environment ────────────────────────────────────────────────────
#   nginx    → host:8082  (system nginx proxies here for api.raven-emrc.com)
#   keycloak → host:8083  (admin / SSO)
#   raven    → internal only (port 8000 inside the network)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  prod_net:
    driver: bridge

volumes:
  static_prod:
  keycloak_prod_data:

services:

  raven:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:latest
    container_name: raven_prod
    env_file: .env
    volumes:
      - static_prod:/app/staticfiles
    networks:
      - prod_net
    depends_on:
      - keycloak
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/api/auth/token/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_prod
    ports:
      - "8082:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod:/static:ro
    depends_on:
      - raven
    networks:
      - prod_net
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak_prod
    command: start
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/keycloak_db
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "8083:8080"
    volumes:
      - keycloak_prod_data:/opt/keycloak/data
    networks:
      - prod_net
    restart: always
