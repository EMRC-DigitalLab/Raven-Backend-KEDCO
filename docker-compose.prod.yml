version: "3.9"

# ── Production environment ────────────────────────────────────────────────────
#   nginx → host:8096  (system nginx proxies here for api.raven-emrc.com)
#   raven → internal only (port 8000 inside the network)
#   Keycloak: uses shared instance at http://31.97.56.29:8083/realms/KEDCO
# ─────────────────────────────────────────────────────────────────────────────

networks:
  prod_net:
    driver: bridge

volumes:
  static_prod:

services:

  raven:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:latest
    container_name: raven_prod
    env_file: .env
    volumes:
      - static_prod:/app/staticfiles
    networks:
      - prod_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/api/auth/token/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_prod
    ports:
      - "8096:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod:/static:ro
    depends_on:
      - raven
    networks:
      - prod_net
    restart: always
