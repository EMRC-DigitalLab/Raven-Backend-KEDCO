version: "3.9"

# ── Production environment ────────────────────────────────────────────────────
#   nginx          → host:8096  (system nginx proxies here for api.raven-emrc.com)
#   raven          → internal only (port 8000 inside the network)
#   celery-worker  → handles notifications + analytics queues
#   celery-sync    → handles datanest_sync queue (DataNest → Raven data pull)
#   celery-beat    → fires all scheduled tasks (every 15 min sync, daily checks)
#   Keycloak: uses shared instance at http://31.97.56.29:8083/realms/KEDCO
# ─────────────────────────────────────────────────────────────────────────────

networks:
  prod_net:
    driver: bridge

volumes:
  static_prod:
  redis_prod:
  celerybeat_prod:

services:

  redis:
    image: redis:7-alpine
    container_name: redis_prod
    volumes:
      - redis_prod:/data
    networks:
      - prod_net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  raven:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:latest
    container_name: raven_prod
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
    volumes:
      - static_prod:/app/staticfiles
    networks:
      - prod_net
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8000/admin/ -o /dev/null -w '%{http_code}' | grep -qE '^(200|301|302)$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Celery: general worker (notifications + analytics) ─────────────────────
  celery-worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:latest
    container_name: celery_worker_prod
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
    entrypoint: ["celery", "-A", "raven", "worker",
                 "-Q", "default,notifications,analytics",
                 "--concurrency=4", "-l", "info"]
    volumes:
      - ./google_token.json:/app/google_token.json:rw
    networks:
      - prod_net
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      raven:
        condition: service_healthy

  # ── Celery: DataNest sync worker (datanest_sync queue) ────────────────────
  celery-sync:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:latest
    container_name: celery_sync_prod
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
    entrypoint: ["celery", "-A", "raven", "worker",
                 "-Q", "datanest_sync",
                 "--concurrency=2", "-l", "info"]
    volumes:
      - ./google_token.json:/app/google_token.json:rw
    networks:
      - prod_net
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      raven:
        condition: service_healthy

  # ── Celery Beat: task scheduler ───────────────────────────────────────────
  celery-beat:
    image: ghcr.io/${GITHUB_REPOSITORY}/raven:latest
    container_name: celery_beat_prod
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
    entrypoint: ["celery", "-A", "raven", "beat", "-l", "info",
                 "--schedule", "/app/celerybeat/celerybeat-schedule"]
    volumes:
      - celerybeat_prod:/app/celerybeat
    networks:
      - prod_net
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      raven:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_prod
    ports:
      - "8096:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod:/static:ro
    depends_on:
      - raven
    networks:
      - prod_net
    restart: always
